name: TrustKernel Supply Chain

on:
  push:
    branches: [main, trustkernel-dev]
    paths:
      - 'backend/requirements.txt'
      - 'backend/supply_chain_check.py'
      - 'backend/tests/test_v1413_supply_chain.py'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact direct-dependency pins
        working-directory: backend
        run: python supply_chain_check.py
      - name: Install audit tooling
        run: python -m pip install pip-audit==2.10.1
      - name: Audit known Python vulnerabilities
        working-directory: backend
        run: python -m pip_audit -r requirements.txt
      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --format cyclonedx-json --output trustkernel-sbom.cdx.json
      - name: Upload CycloneDX SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: trustkernel-cyclonedx-sbom
          path: backend/trustkernel-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          show-openssf-scorecard: true
