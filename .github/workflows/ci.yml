name: TrustKernel CI

on:
  push:
    branches: [main, trustkernel-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: development
        run: pytest -q
      - name: Run deterministic regression benchmark
        working-directory: backend
        run: python benchmark.py > /tmp/trustkernel-benchmark.json
