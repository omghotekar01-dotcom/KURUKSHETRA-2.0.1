name: TrustKernel CI

on:
  push:
    branches: [main, trustkernel-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: development
        run: pytest -q
      - name: Run deterministic regression benchmark
        working-directory: backend
        run: python benchmark.py > /tmp/trustkernel-benchmark.json
      - name: Run Judge Mode regression gate
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: development
        run: |
          python - <<'PY'
          from app.v13_api import judge_demo_v13
          result = judge_demo_v13()
          assert result["mode"] == "TRUSTKERNEL_V1_3_JUDGE_DEMO"
          assert len(result["sequence"]) == 6
          assert result["audit_chain"]["valid"] is True
          print("Judge Mode regression gate passed")
          PY
      - name: Validate production deployment gate
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: production
          TRUSTKERNEL_REQUIRE_API_KEY: '1'
          TRUSTKERNEL_ALLOW_LEGACY_ACTOR_HEADER: '0'
          TRUSTKERNEL_REQUIRE_POLICY_APPROVAL: '1'
          TRUSTKERNEL_POLICY_FOUR_EYES: '1'
          TRUSTKERNEL_CORS_ORIGINS: https://console.trustkernel.example
          TRUSTKERNEL_SESSION_SIGNING_KEY: ssssssssssssssssssssssssssssssssssssssssssssssss
          TRUSTKERNEL_A2A_SIGNING_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRUSTKERNEL_POLICY_SIGNING_KEY: pppppppppppppppppppppppppppppppppppppppppppppppp
          TRUSTKERNEL_EVIDENCE_SIGNING_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          TRUSTKERNEL_OIDC_ISSUER: https://idp.example.com
          TRUSTKERNEL_OIDC_AUDIENCE: trustkernel-prod
          TRUSTKERNEL_OIDC_REQUIRE_HTTPS: '1'
          TRUSTKERNEL_DB_BACKEND: postgres
          TRUSTKERNEL_DATABASE_URL: postgresql://trustkernel:ci-only@postgres:5432/trustkernel
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
        run: python deployment_check.py > /tmp/trustkernel-production-readiness.json
