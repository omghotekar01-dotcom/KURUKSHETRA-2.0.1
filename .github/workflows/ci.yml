name: TrustKernel CI

on:
  push:
    branches: [trustkernel-dev]

jobs:
  otlp-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Import OTLP service
        working-directory: backend
        run: python -c "from app.services.otlp import _resolve_native_endpoint; print('import-ok')"
      - name: Verify canonical OTLP runtime version
        working-directory: backend
        run: python -c "from pathlib import Path; from app.services.otlp import _runtime_version; expected=Path('../VERSION').read_text().strip(); assert _runtime_version() == expected"
      - name: Verify signal endpoint precedence
        working-directory: backend
        run: pytest -q tests/test_v1418_otel_hardening.py::test_native_endpoint_resolution_honors_signal_specific_precedence
      - name: Verify global endpoint expansion
        working-directory: backend
        run: pytest -q tests/test_v1418_otel_hardening.py::test_native_endpoint_resolution_appends_trace_path_to_global_endpoint
