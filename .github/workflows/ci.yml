name: TrustKernel CI

on:
  push:
    branches: [main, trustkernel-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustkernel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: trustkernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustkernel -d trustkernel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate Python SDK distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build sdk
          python -m twine check sdk/dist/*
          python -m pip install --force-reinstall sdk/dist/*.whl
          python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import trustkernel

          assert version("trustkernel-sdk") == "1.4.22"
          assert files("trustkernel").joinpath("py.typed").is_file()
          assert hasattr(trustkernel, "TrustKernelClient")
          print("TrustKernel SDK packaged artifact smoke passed")
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run live PostgreSQL persistence integration
        working-directory: backend
        env:
          TRUSTKERNEL_POSTGRES_TEST_URL: postgresql://trustkernel:ci-only@127.0.0.1:5432/trustkernel
        run: pytest -q tests/test_v1416_postgres_integration.py
      - name: Run live Redis distributed quota integration
        working-directory: backend
        env:
          TRUSTKERNEL_REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: pytest -q tests/test_v1417_redis_quota_integration.py
      - name: Run v1.4.18 OTLP transport regressions
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: development
        run: pytest -q tests/test_v1418_otel_hardening.py
      - name: Run production readiness regressions
        working-directory: backend
        run: pytest -q tests/test_v146_deployment_readiness.py
      - name: Run release integrity regressions
        working-directory: backend
        run: pytest -q tests/test_release_check.py
      - name: Run submission manifest regressions
        working-directory: backend
        run: pytest -q tests/test_submission_manifest.py
      - name: Run unified judge rehearsal gate
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: development
        run: python rehearsal.py --iterations 3 > /tmp/trustkernel-rehearsal.json
      - name: Validate production deployment gate
        working-directory: backend
        env:
          TRUSTKERNEL_ENV: production
          TRUSTKERNEL_REQUIRE_API_KEY: '1'
          TRUSTKERNEL_ALLOW_LEGACY_ACTOR_HEADER: '0'
          TRUSTKERNEL_REQUIRE_POLICY_APPROVAL: '1'
          TRUSTKERNEL_POLICY_FOUR_EYES: '1'
          TRUSTKERNEL_CORS_ORIGINS: https://console.trustkernel.example
          TRUSTKERNEL_SESSION_SIGNING_KEY: ssssssssssssssssssssssssssssssssssssssssssssssss
          TRUSTKERNEL_A2A_SIGNING_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRUSTKERNEL_POLICY_SIGNING_KEY: pppppppppppppppppppppppppppppppppppppppppppppppp
          TRUSTKERNEL_EVIDENCE_SIGNING_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          TRUSTKERNEL_OIDC_ISSUER: https://idp.example.com
          TRUSTKERNEL_OIDC_AUDIENCE: trustkernel-prod
          TRUSTKERNEL_OIDC_REQUIRE_HTTPS: '1'
          TRUSTKERNEL_DB_BACKEND: postgres
          TRUSTKERNEL_DATABASE_URL: postgresql://trustkernel:ci-only@postgres:5432/trustkernel
          TRUSTKERNEL_QUOTA_BACKEND: redis
          TRUSTKERNEL_REDIS_URL: rediss://redis.internal.example:6379/0
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://otel-collector.example/v1/traces
        run: python deployment_check.py > /tmp/trustkernel-production-readiness.json
