[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trustkernel-sdk"
version = "1.4.22"
description = "Framework-agnostic Python SDK and guards for the TrustKernel AI-agent security runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TrustKernel" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/omghotekar01-dotcom/KURUKSHETRA-2.0.1"
Documentation = "https://github.com/omghotekar01-dotcom/KURUKSHETRA-2.0.1/tree/main/docs"
Issues = "https://github.com/omghotekar01-dotcom/KURUKSHETRA-2.0.1/issues"

[tool.hatch.build.targets.wheel]
packages = ["trustkernel"]

[tool.hatch.build.targets.sdist]
include = [
  "/trustkernel",
  "/README.md",
  "/pyproject.toml",
]
